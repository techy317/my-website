<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Image</title>
    <link rel="stylesheet" href="fun.css">
</head>
<body>

    <div class="container">
        <details id="secret-details">
            <summary>Click Me</summary>
            <div class="image-wrapper">
                <img id="secret-image" alt="Funny Image">
            </div>
        </details>
    </div>

    <script>
        document.getElementById('secret-details').addEventListener('toggle', function() {
            if (this.open) {
                document.getElementById('secret-image').src = 'fun.jpg';
            }
        });
    </script>

</body>
</html>
