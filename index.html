<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <details>
            <summary onclick="showImage()">Click Me</summary>
            <div class="image-wrapper">
                <img id="secret-image" src="" alt="Funny Image" style="display: none;">
            </div>
        </details>
    </div>

    <script>
        function showImage() {
            document.getElementById('secret-image').src = 'fun.jpg';
            document.getElementById('secret-image').style.display = 'block';
        }
    </script>

</body>
</html>
